plugins {
    id 'com.android.application'
}

android {
    namespace = 'app.lev.browser'
    compileSdk = 35

    defaultConfig {
        applicationId = 'app.lev.browser'
        minSdk = 29
        targetSdk = 34
        // Номер сборки GitHub = номер версии: по нему браузер понимает, что есть обновление.
        versionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName = '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
        // Только 64-битные ARM (все современные телефоны, Pixel 10a тоже) — APK в разы меньше
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Постоянный ключ подписи: новые версии ставятся поверх старой.
    signingConfigs {
        debug {
            storeFile = file('debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    // Тёмная тема сайтов, скрипты до загрузки страницы.
    implementation 'androidx.webkit:webkit:1.12.1'
    // Обновление страницы жестом «потянуть вниз».
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // Перевод страниц прямо на телефоне (офлайн-модели Google).
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
}
