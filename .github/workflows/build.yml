name: Собрать APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Применить обновление исходников (если есть)
        run: |
          if [ ! -f update.b64 ]; then echo "обновления нет"; exit 0; fi
          base64 -d update.b64 | xz -dc > /tmp/update.patch
          git apply --whitespace=nowarn /tmp/update.patch
          if [ -f update-remove.txt ]; then
            while read -r f; do [ -n "$f" ] && rm -rf -- "$f"; done < update-remove.txt
            rm -f update-remove.txt
          fi
          rm -f update.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Обновление исходников" || true
          git push

      - name: Картинки (значки, фоны, лев)
        run: python3 tools/make_drawables.py app/src/main/res /tmp/preview

      - name: Списки блокировки рекламы
        run: |
          mkdir -p app/src/main/assets/filters
          cd app/src/main/assets/filters
          get() { curl -fsSL --retry 3 --max-time 120 "$2" -o "$1" || echo "! не скачался" > "$1"; }
          get easylist_ru.txt "https://easylist-downloads.adblockplus.org/ruadlist+easylist.txt"
          get easyprivacy.txt "https://easylist.to/easylist/easyprivacy.txt"
          get czech.txt "https://raw.githubusercontent.com/tomasko126/easylistczechandslovak/master/filters.txt"
          get notifications.txt "https://easylist-downloads.adblockplus.org/fanboy-notifications.txt"
          get peterlowe.txt "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=adblockplus&showintro=0&mimetype=plaintext"
          wc -l *.txt

      - name: Шрифты для надписи (свободные, OFL и GUST)
        run: |
          mkdir -p app/src/main/assets/fonts
          cd app/src/main/assets/fonts
          G=https://raw.githubusercontent.com/google/fonts/main/ofl
          get() { curl -fsSL --retry 3 --max-time 60 "$2" -o "$1" || rm -f "$1"; }
          get montserrat.ttf "$G/montserrat/Montserrat%5Bwght%5D.ttf"
          get firasans_thin.ttf "$G/firasans/FiraSans-Thin.ttf"
          get poppins_medium.ttf "$G/poppins/Poppins-Medium.ttf"
          get lora_italic.ttf "$G/lora/Lora-Italic%5Bwght%5D.ttf"
          get cardo.ttf "$G/cardo/Cardo-Regular.ttf"
          get anton.ttf "$G/anton/Anton-Regular.ttf"
          get anonymous.ttf "$G/anonymouspro/AnonymousPro-Regular.ttf"
          get archivo_black.ttf "$G/archivoblack/ArchivoBlack-Regular.ttf"
          sudo apt-get install -y -qq fonts-texgyre > /dev/null 2>&1 || true
          T=/usr/share/texmf/fonts/opentype/public/tex-gyre
          cp "$T/texgyreadventor-bold.otf" adventor_bold.otf 2>/dev/null || true
          cp "$T/texgyrechorus-mediumitalic.otf" chorus.otf 2>/dev/null || true
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Сборка APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Журнал ошибок (если сборка упала)
        if: failure()
        run: |
          touch build.log
          grep -E "error:|e: |FAILURE|What went wrong|wrong:|> |Error|error " build.log | head -n 150 > /tmp/errors.txt || true
          echo "-----" >> /tmp/errors.txt
          tail -n 120 build.log >> /tmp/errors.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan logs
          git rm -rf --cached . > /dev/null
          cp /tmp/errors.txt build-log.txt
          git add build-log.txt
          git commit -m "build log $GITHUB_RUN_NUMBER"
          git push -f origin logs

      - name: Подготовить файл
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BySS.apk
          # Копия под старым именем: версии до сборки 25 ищут файл Lev.apk и иначе не обновятся.
          # Убрать, когда на телефоне будет сборка 26 или новее.
          cp BySS.apk Lev.apk

      - name: Опубликовать для скачивания
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "byss-$GITHUB_RUN_NUMBER" BySS.apk Lev.apk --repo "$GITHUB_REPOSITORY" \
            --title "BySS, сборка $GITHUB_RUN_NUMBER" \
            --notes "Откройте эту страницу на телефоне, скачайте BySS.apk и установите. Или в браузере ⋮ → Обновить браузер."
